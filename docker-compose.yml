
services:
  postgres:
    image: postgres:17
    container_name: envirotrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: envirotrack
      POSTGRES_USER: envirotrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envirotrack_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envirotrack -d envirotrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
